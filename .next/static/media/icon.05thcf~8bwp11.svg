<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Godwin Hotels Official Emblem Badge -->
  <defs>
    <!-- Warm Mustard Gold Gradient for Upper Leaf -->
    <linearGradient id="leafGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A838"/>
      <stop offset="60%" stop-color="#D49626"/>
      <stop offset="100%" stop-color="#C28418"/>
    </linearGradient>

    <!-- Rich Magenta Violet for Lower Welcoming Hand -->
    <linearGradient id="handMagentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B32B8C"/>
      <stop offset="60%" stop-color="#9C2378"/>
      <stop offset="100%" stop-color="#841B65"/>
    </linearGradient>
  </defs>

  <!-- Circular Base Badge with Deep Royal Purple Ring & Crisp White Backing -->
  <circle cx="50" cy="50" r="46.5" fill="#FFFFFF" stroke="#582A75" stroke-width="4.5"/>

  <!-- UPPER SHAPE: WARM GOLDEN LEAF WITH CENTRAL SPINE -->
  <!-- Upper Half of Leaf -->
  <path d="M 33 39
           C 43 27, 65 25, 86 48
           C 69 38, 51 38, 33 39 Z"
        fill="url(#leafGoldGrad)"/>

  <!-- Lower Half of Leaf -->
  <path d="M 38 43
           C 54 42, 71 42, 86 48
           C 77 57, 61 58, 46 50
           C 42 48, 39 45, 38 43 Z"
        fill="url(#leafGoldGrad)"/>

  <!-- Crisp White Leaf Central Spine -->
  <path d="M 33 39 C 51 40, 69 42, 86 48"
        fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- LOWER SHAPE: RICH MAGENTA WELCOMING HAND (Cups Upwards) -->
  <path d="M 14 50
           C 21 44, 30 41, 40 43
           C 46 45, 51 49, 53 52
           C 46 52, 42 54, 39 56
           C 47 56, 59 58, 74 56
           C 64 66, 52 70, 38 68
           C 25 66, 17 58, 14 50 Z"
        fill="url(#handMagentaGrad)"/>
</svg>
