<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Godwin Hotels Official Emblem Badge -->
  <defs>
    <!-- Vibrant Saffron Orange to Amber Gold Gradient for Upper Leaf -->
    <linearGradient id="leafOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="50%" stop-color="#F57C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Imperial Royal Purple / Violet Gradient for Lower Welcoming Hand -->
    <linearGradient id="handPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C27B0"/>
      <stop offset="50%" stop-color="#6A1B9A"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>

    <!-- Luxury 24K Metallic Gold Ring Gradient -->
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="35%" stop-color="#F5DF9E"/>
      <stop offset="70%" stop-color="#AA7A1E"/>
      <stop offset="100%" stop-color="#C8922E"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for contrast on all backgrounds -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Circular Base Badge with 24K Gold Ring & Clean White Backing -->
  <circle cx="50" cy="50" r="46.5" fill="#FFFFFF" stroke="url(#ringGold)" stroke-width="3" filter="url(#badgeShadow)"/>

  <!-- ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ
       UPPER SHAPE: ORANGE SAFFRON LEAF WITH WHITE SPINE
  ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ -->
  <!-- Upper Half of Leaf -->
  <path d="M 33 39
           C 43 27, 65 25, 86 48
           C 69 38, 51 38, 33 39 Z"
        fill="url(#leafOrangeGrad)"/>

  <!-- Lower Half of Leaf -->
  <path d="M 38 43
           C 54 42, 71 42, 86 48
           C 77 57, 61 58, 46 50
           C 42 48, 39 45, 38 43 Z"
        fill="url(#leafOrangeGrad)"/>

  <!-- Crisp White Leaf Central Spine -->
  <path d="M 33 39 C 51 40, 69 42, 86 48"
        fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ
       LOWER SHAPE: ROYAL PURPLE WELCOMING HAND (Cups Upwards)
  ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ -->
  <path d="M 14 50
           C 21 44, 30 41, 40 43
           C 46 45, 51 49, 53 52
           C 46 52, 42 54, 39 56
           C 47 56, 59 58, 74 56
           C 64 66, 52 70, 38 68
           C 25 66, 17 58, 14 50 Z"
        fill="url(#handPurpleGrad)"/>
</svg>
